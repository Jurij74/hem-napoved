    const p = P[i];
    svgs.forEach(s => { const c = s.querySelector('.cross'); c.setAttribute('x1', xs(i) + bw / 2); c.setAttribute('x2', xs(i) + bw / 2); c.setAttribute('visibility', 'visible'); });
    tip.innerHTML = `<b>${p.t}</b><br>HEE: ${fmt(p.battery)} kW${p.actual!=null?` · dejansko ${fmt(p.actual)} kW`:''}<br>SOC: ${fmt(p.soc,1)} %<br>SE Helium: ${fmt(p.pv)} kW · poraba: ${fmt(p.load)} kW<br>uvoz ${fmt(p.import)} kW · izvoz ${fmt(p.export)} kW<br>${D.javno ? `spot ${fmt(p.spot,1)} c/kWh` : `nakup ${fmt(p.buy,1)} · prodaja ${fmt(p.sell,1)} c/kWh<br>prihodek Helium: ${fmt(p.cash,2)} €`}${p.note?'<br>'+p.note:''}`;
    tip.style.display = 'block'; tip.style.left = Math.min(ev.clientX + 14, innerWidth - 260) + 'px'; tip.style.top = (ev.clientY + 14) + 'px';
  });
  svg.addEventListener('mouseleave', hide);
});
function hide() { tip.style.display = 'none'; svgs.forEach(s => s.querySelector('.cross').setAttribute('visibility', 'hidden')); }
const cols = [['t','čas'],['battery','HEE kW'],['soc','SOC %'],['pv','SE Helium kW'],['load','poraba kW'],['import','uvoz kW'],['export','izvoz kW']].concat(
  D.javno ? [['spot','spot c/kWh']] : [['buy','nakup c/kWh'],['sell','prodaja c/kWh'],['cash','prihodek €']]);
document.getElementById('tbl').innerHTML = '<table><tr>' + cols.map(c => `<th>${c[1]}</th>`).join('') + '</tr>' + P.map(p => '<tr>' + cols.map(c => `<td>${c[0]==='t'?p.t:fmt(p[c[0]], ['cash','buy','sell','soc','spot'].includes(c[0])?1:0)}</td>`).join('') + '</tr>').join('') + '</table>';
</script>
</body>
</html>
